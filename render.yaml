services:
  - type: web
    name: compliance-engine-api
    env: python
    rootDir: compliance-engine
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: AUTO_CREATE_SCHEMA
        value: false
      - key: FILE_STORAGE_BACKEND
        value: database
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEYS
        sync: false
