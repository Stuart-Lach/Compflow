services:
  - type: web
    name: compliance-engine-api
    env: python
    rootDir: compliance-engine
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: AUTO_CREATE_SCHEMA
        value: false
      - key: FILE_STORAGE_BACKEND
        value: database
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEY_BINDINGS
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: 120
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_SESSION_TTL_SECONDS
        value: 28800
      - key: ADMIN_COOKIE_SECURE
        value: true
