name: Compliance Engine CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compliance-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compliance-engine/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests migrations

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: python -m pytest

      - name: Verify migrations
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
          APP_ENV: development
        run: |
          python -m alembic upgrade head
          python -m alembic check
